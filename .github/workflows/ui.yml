name: UI checks

on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow checks local demo UI only. It has no deployment or write steps.
permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Build, test, and capture UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types, lint, formatting, and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
      - name: Build UI preview
        run: npm run build
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run rendered UI checks
        run: bunx --no-install playwright test
      - name: Upload screenshots, traces, and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dazi-ui-review-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
