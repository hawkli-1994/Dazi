name: UI checks

on:
  push:
  pull_request:
  workflow_dispatch:

# Checks browser demo and controlled native-runtime fixtures. No deployment or write steps.
permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Build, test, and capture UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types, lint, formatting, and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
      - name: Build UI preview
        run: npm run build
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Install CJK fonts for the system serif and sans stacks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match 'Noto Serif CJK SC'
      - name: Run rendered UI checks
        run: bunx --no-install playwright test
      - name: Upload screenshots, traces, and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dazi-ui-review-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Exercise sandboxed desktop and native recovery
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop and renderer
        run: |
          npm run build
          bun run build:desktop
          node node_modules/electron/install.js
      - name: Exercise real Electron Host and persistence
        env:
          DEBUG: pw:browser*
        run: npm run test:electron
      - name: Upload actual desktop captures and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dazi-desktop-review-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package and launch (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned application and trial archive
        run: bun run package:desktop
      - name: Launch relocated production package with isolated storage
        run: bun run test:package
      - name: Upload unsigned trial archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dazi-unsigned-${{ matrix.runner }}-${{ github.sha }}
          path: |
            out/*.tar.gz
            out/*.sha256
            out/*/build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload package launch captures and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dazi-package-review-${{ matrix.runner }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
